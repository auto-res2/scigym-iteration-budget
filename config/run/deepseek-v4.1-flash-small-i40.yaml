model: deepseek-v4.1-flash  # vLLM の --served-model-name（モデル短名。どの run のサーバーでも同じ）
split: small
max_iterations: 40
base_url_file: /data1/rkp00041/vllm/rku00122/deepseek-v4.1-flash-small-i40.url  # サーバー job が書く接続先。run ごとに 1 サーバー
